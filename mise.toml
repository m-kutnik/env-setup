[tools]
"aqua:numtide/treefmt" = "latest"
bun = "latest"
gitleaks = "latest"
node = "latest"
shfmt = "latest"

[env]
_ = { path = "./node_modules/.bin" }

[tasks.setup]
description = "Full initialization, runs all required + optional scripts, links dotfiles"
extends = "bash_baseline"
run = "./scripts/bash/setup.sh"

[tasks."install:homebrew"]
description = "Installs Homebrew packages"
extends = "bash_baseline"
run = [
  "./scripts/bash/darwin/install-homebrew-base.sh",
  "./scripts/bash/darwin/install-homebrew-extras.sh",
]

[tasks."install:pi"]
description = "Installs Pi and Pi extensions"
extends = "bash_baseline"
run = [
  "bun add -g --ignore-scripts @earendil-works/pi-coding-agent",
  "bun scripts/bun/install-pi-extensions.ts",
]

[tasks.apply-defaults]
description = "Applies app/system default settings"
extends = "bash_baseline"
run = "./scripts/bash/darwin/apply-defaults.sh"

[tasks.restart-apps]
description = "Restart macOS apps after configuration changes"
extends = "bash_baseline"
run = "./scripts/bash/darwin/restart-apps.sh"

[tasks.format]
description = "Run project-wide formatting"
run = "oxfmt && treefmt"
depends = ["sync-ignore"]

[tasks.sync-ignore]
description = "Sync ignore files"
run = "bun scripts/bun/sync-ignore.ts"
hide = true

[deps]
bun = { auto = true }
git-submodule = { auto = true }

[settings]
dotfiles = { default_mode = "symlink" }

[task_templates]
bash_baseline = { usage = """
flag "-f --force" help="Accept everything, including potentially destructive actions"
flag "--auth" help="Enables Bitwarden vault unlock (e.g. license import)"
""" }

[dotfiles]
"~/.config/ghostty" = { source = "dotfiles/ghostty/.config/ghostty" }
"~/.config/karabiner" = { source = "dotfiles/karabiner/.config/karabiner" }
"~/.config/mise" = { source = "dotfiles/mise/.config/mise" }
"~/.omp" = { source = "dotfiles/omp/.omp" }
"~/.agents" = { source = "dotfiles/pi/.agents" }
"~/.claude" = { source = "dotfiles/pi/.claude" }
"~/.pi" = { source = "dotfiles/pi/.pi" }
"~/.config/zed" = { source = "dotfiles/zed/.config/zed" }
"~/.zsh" = { source = "dotfiles/zsh/.zsh" }
"~/.p10k.zsh" = { source = "dotfiles/zsh/.p10k.zsh" }
"~/.zshenv" = { source = "dotfiles/zsh/.zshenv" }
"~/.zshrc" = { source = "dotfiles/zsh/.zshrc" }
